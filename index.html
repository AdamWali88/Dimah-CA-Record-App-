<body>
<div id="loginView" class="login">
  <div class="login-card">
    <div class="brand">
      <img id="loginLogo" class="logo" alt="School logo">

<script>
const KEY='dimah_academy_ca_record_v1';
const defaults={
  school:"DIMAH ACADEMY",
  title:"STUDENTS' CONTINUOUS ASSESSMENT RECORD",
  facilitator:"",
  session:"",
  term:"",
  logo:"",
  username:"admin",
  password:"admin123",
  students:[],
  assessments:[],
  finalScores:{},
  questionSets:[],
  exams:[],
  classes:[],
  currentClassId:""
};
let db=load(); let currentPage='dashboard';
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...defaults}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db)); syncAuthStorage();}
function syncAuthStorage(){localStorage.setItem(KEY+'_auth',JSON.stringify({username:db.username,password:db.password}));}
function normalizeDb(){db.classes=Array.isArray(db.classes)?db.classes:[];db.currentClassId=db.currentClassId||'';db.finalScores=db.finalScores&&typeof db.finalScores==='object'?db.finalScores:{};db.students=(db.students||[]).map(s=>({...s,classId:s.classId||''}));const auth=(()=>{try{return JSON.parse(localStorage.getItem(KEY+'_auth')||'null')}catch(e){return null}})();if(auth&&typeof auth.username==='string'&&auth.username.trim()){db.username=auth.username.trim();if(typeof auth.password==='string'&&auth.password)db.password=auth.password;}syncAuthStorage();}
function classLabel(c){return c?`${c.name}${c.section?` ${c.section}`:''}`:''}
function currentClass(){return db.classes.find(c=>c.id===db.currentClassId)||null}
function classStudents(){const c=currentClass();return c?db.students.filter(s=>s.classId===c.id):[]}
function legacyStudents(){return db.students.filter(s=>!s.classId)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function schoolInitials(){const words=String(db.school||"School").trim().split(/\s+/).filter(Boolean);return (words.slice(0,2).map(w=>w.replace(/[^a-z0-9]/ig,"")[0]||"").join("")||"SC").toUpperCase()}
function logoSrc(){return db.logo||'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" rx="100" fill="#e8eef3"/><circle cx="100" cy="100" r="78" fill="var(--navy)"/><text x="100" y="116" text-anchor="middle" font-family="Arial" font-size="58" font-weight="bold" fill="white">${schoolInitials()}</text></svg>`.replace('var(--navy)','#1769aa'))}
function applySchoolTheme(){const fallback=['#12345a','#1769aa','#0d9488','#f2b84b'];if(!db.logo){setThemeColors(fallback);return}const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,64,64);const d=x.getImageData(0,0,64,64).data,counts={};for(let i=0;i<d.length;i+=4){if(d[i+3]<180)continue;const r=d[i],g=d[i+1],b=d[i+2],max=Math.max(r,g,b),min=Math.min(r,g,b),sat=max?((max-min)/max):0;if(max>246&&min>230)continue;if(max<28)continue;if(sat<.12&&max>125)continue;const q=[r,g,b].map(v=>Math.min(255,Math.round(v/32)*32));const hex='#'+q.map(v=>Math.min(255,v).toString(16).padStart(2,'0')).join('');counts[hex]=(counts[hex]||0)+1}const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);const distinct=[];for(const color of ranked){if(!distinct.some(c=>colorDistance(c,color)<70))distinct.push(color);if(distinct.length===4)break}if(distinct.length){const primary=ensureDarkColor(distinct[0]),secondary=distinct[1]||fallback[1],tertiary=distinct[2]||fallback[2],accent=distinct[3]||fallback[3];setThemeColors([primary,secondary,tertiary,accent])}else setThemeColors(fallback)}catch(e){setThemeColors(fallback)}};im.onerror=()=>setThemeColors(fallback);im.src=db.logo}
function colorDistance(a,b){const x=a.match(/[a-f0-9]{2}/ig).map(v=>parseInt(v,16)),y=b.match(/[a-f0-9]{2}/ig).map(v=>parseInt(v,16));return Math.sqrt(x.reduce((n,v,i)=>n+(v-y[i])**2,0))}
function ensureDarkColor(hex){const rgb=hex.match(/[a-f0-9]{2}/ig).map(v=>parseInt(v,16));const lum=(.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2])/255;if(lum>.48)return '#'+rgb.map(v=>Math.round(v*.62).toString(16).padStart(2,'0')).join('');return hex}

function setThemeColors(colors){const root=document.documentElement;root.style.setProperty('--navy',colors[0]);root.style.setProperty('--blue',colors[1]);root.style.setProperty('--teal',colors[2]);root.style.setProperty('--gold',colors[3]);root.style.setProperty('--shadow',`0 10px 30px ${colors[0]}22`);const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=colors[0];const login=document.querySelector('.login');if(login)login.style.background=`radial-gradient(circle at 20% 20%,rgba(255,255,255,.18),transparent 25%),linear-gradient(135deg,${colors[0]},${colors[1]} 58%,${colors[2]})`;const sidebar=document.querySelector('.sidebar');if(sidebar)sidebar.style.background=colors[0];const hero=document.querySelector('.hero');if(hero)hero.style.background=`linear-gradient(110deg,${colors[0]},${colors[1]})`;const toastEl=document.querySelector('.toast');if(toastEl)toastEl.style.background=colors[0];document.querySelectorAll('.primary,.tab.active').forEach(el=>{el.style.background=colors[0];el.style.color='#fff'});document.querySelectorAll('.secondary,.mobile-menu,.back-btn').forEach(el=>{el.style.background=colors[1]+'18';el.style.color=colors[0]});document.querySelectorAll('.module').forEach(el=>{el.style.borderColor=colors[1]+'45'});document.querySelectorAll('.module .icon').forEach(el=>{el.style.color=colors[1]});document.querySelectorAll('.stat .num,.section-title h3,.topbar h1,.brand-strip .school-name,.login-title').forEach(el=>{el.style.color=colors[0]});document.querySelectorAll('.csv-panel').forEach(el=>{el.style.borderColor=colors[1]+'55';el.style.background=colors[1]+'0d'})}

function init(){
 normalizeDb();applySchoolTheme();
 document.getElementById('loginLogo').src=logoSrc();document.getElementById('loginSchool').textContent=db.school;document.getElementById('username').value=db.username;
 document.getElementById('sideSchool').textContent=db.school;document.getElementById('sideLogo').src=logoSrc();
 // Always require a fresh login whenever the app is launched.
 document.getElementById('loginView').classList.remove('hidden');
 document.getElementById('appView').classList.add('hidden');

}

 const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;

 ${c?`<div class="notice"><b>${esc(classLabel(c))}</b> • Session: ${esc(c.session||'—')} • Term: ${esc(c.term||'—')} ${legacy.length?`<br><br><b>${legacy.length} existing student name${legacy.length===1?'':'s'}</b> from your previous version are preserved. After selecting/creating the correct class, use <b>Assign Existing Names</b> below to keep them.`:''}</div>`:''}
 ${c&&legacy.length?`<div class="actions" style="margin:10px 0"><button class="primary" onclick="assignLegacyToCurrentClass()">Assign Existing Names to ${esc(classLabel(c))}</button></div>`:''}
 <div class="section-title"><h3>${c?esc(classLabel(c))+' — '+list.length+' Student'+(list.length===1?'':'s'):'Select a class'}</h3>${c?`<button class="secondary" onclick="printStudents()">Print List</button>`:''}</div>
 ${c?`<div class="table-wrap"><table class="table"><thead><tr><th>S/N</th><th>Student Name</th><th>Gender</th><th>Admission No.</th><th>Action</th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="empty">No students added to this class yet.</td></tr>`}</tbody></table></div>`:''}</div>`;

function openClassModal(){
 openModal('Set Up Class Details',`<div class="row"><div class="field"><label>Class</label><input id="cn" placeholder="e.g. SS3"></div><div class="field"><label>Section / Arm</label><input id="cs" placeholder="e.g. A"></div><div class="field"><label>Session</label><input id="cse" value="${esc(db.session)}" placeholder="e.g. 2026/2027"></div><div class="field"><label>Term</label><input id="ct" value="${esc(db.term)}" placeholder="e.g. First Term"></div></div><div class="notice">This class identity will be attached to every student added from now on. Create a separate class profile for another class.</div><button class="primary" onclick="createClass()">Save Class Details</button>`);
}
function createClass(){
 const name=document.getElementById('cn').value.trim(),section=document.getElementById('cs').value.trim(),session=document.getElementById('cse').value.trim(),term=document.getElementById('ct').value.trim();
 if(!name)return toast('Enter the class name.');
 const label=(name+' '+section).trim();
 const exists=db.classes.find(x=>sameKey(classLabel(x),label)&&sameKey(x.session,session)&&sameKey(x.term,term));
 if(exists){db.currentClassId=exists.id;save();closeModal();render();return toast('That class already exists and is now selected.');}
 const c={id:'c_'+Date.now()+Math.random().toString(36).slice(2),name,section,session,term};db.classes.push(c);db.currentClassId=c.id;save();closeModal();render();toast('Class details saved.');
}
function switchClass(id){db.currentClassId=id;save();render()}
function assignLegacyToCurrentClass(){const c=currentClass();if(!c)return toast('Select a class first.');if(!legacyStudents().length)return toast('No unassigned existing names found.');if(confirm(`Assign all ${legacyStudents().length} existing student names to ${classLabel(c)}?`)){db.students.forEach(s=>{if(!s.classId)s.classId=c.id});save();render();toast('Existing student names have been preserved and assigned to this class.')}}
function openStudentModal(){
 const c=currentClass();if(!c)return toast('Create/select the class details first.');
 openModal(`Add Student — ${classLabel(c)}`,`<div class="notice">Class: <b>${esc(classLabel(c))}</b> • ${esc(c.session||'')} ${c.term?'• '+esc(c.term):''}</div><div class="row"><div class="field full"><label>Student full name</label><input id="sn"></div><div class="field"><label>Gender</label><select id="sg"><option>Male</option><option>Female</option></select></div><div class="field"><label>Admission No. (optional)</label><input id="sa"></div></div><button class="primary" onclick="addStudent()">Save Student</button>`);
}
function addStudent(){
 const c=currentClass();if(!c)return toast('Create/select the class details first.');
 const name=document.getElementById('sn').value.trim();if(!name)return toast('Enter the student name.');
 if(classStudents().some(s=>sameKey(s.name,name))){return toast('Duplicate name: a student with this exact name is already in this class. Please check the name.');}
 db.students.push({id:Date.now().toString(36)+Math.random(),name,gender:document.getElementById('sg').value,admission:document.getElementById('sa').value.trim(),classId:c.id});
 sortStudents();save();closeModal();render();toast('Student name saved.');
}
function editStudent(id){
 const st=db.students.find(s=>String(s.id)===String(id));
 if(!st)return toast('Student not found.');
 openModal('Edit Student Name',`<div class="notice">Current name: <b>${esc(st.name)}</b></div><div class="field"><label>Student full name</label><input id="editStudentName" value="${esc(st.name)}" autocomplete="off"></div><button class="primary" onclick="saveStudentName('${st.id}')">Save Name</button>`);
}
function saveStudentName(id){
 const st=db.students.find(s=>String(s.id)===String(id));
 if(!st)return toast('Student not found.');
 const name=document.getElementById('editStudentName').value.trim();
 if(!name)return toast('Enter the student name.');
 const c=currentClass();
 if(c && classStudents().some(s=>String(s.id)!==String(id)&&sameKey(s.name,name)))return toast('Duplicate name: a student with this exact name is already in this class. Please check the name.');
 st.name=name;
 sortStudents();
 save();closeModal();render();toast('Student name updated. Existing assessment records remain linked to the student.');
}
function openBulkModal(){
 const c=currentClass();if(!c)return toast('Create/select the class details first.');
 openModal(`Bulk Add Students — ${classLabel(c)}`,`<div class="notice">These names will be added only to <b>${esc(classLabel(c))}</b>. Existing names from other classes will not be mixed.</div><div class="field"><label>Student names — one per line</label><textarea id="bulk" rows="12" placeholder="Aisha Bello\nAminu Musa\nFatima Sani"></textarea></div><div class="field"><label>Gender for imported names</label><select id="bg"><option value="">Leave blank</option><option>Male</option><option>Female</option></select></div><button class="primary" onclick="bulkAdd()">Import & Save</button>`);
}
function bulkAdd(){
 const c=currentClass();if(!c)return toast('Create/select the class details first.');
 const names=document.getElementById('bulk').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),g=document.getElementById('bg').value;
 const existing=new Set(classStudents().map(s=>s.name.trim().toLowerCase()));let added=0,duplicates=0;
 names.forEach(name=>{const key=name.trim().toLowerCase();if(existing.has(key)){duplicates++;return}db.students.push({id:Date.now().toString(36)+Math.random(),name,gender:g,admission:'',classId:c.id});existing.add(key);added++});
 sortStudents();save();closeModal();render();toast(`${added} student${added===1?'':'s'} imported${duplicates?`; ${duplicates} exact duplicate name${duplicates===1?' was':'s were'} skipped in this class`:''}.`);
}
function sortStudents(){db.students.sort((a,b)=>String(a.name||'').trim().localeCompare(String(b.name||'').trim(),undefined,{sensitivity:'base',numeric:false}))}
function deleteStudent(id){if(confirm('Delete this student from this class?')){db.students=db.students.filter(s=>s.id!==id);save();render();}}

function sameKey(a,b){return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase()}
function finalScoreKey(className,subject,session,term,studentId){return [className,subject,session,term,studentId].map(v=>String(v??'').trim().toLowerCase()).join('::')}
function cumulativeCA(subject,className){
  const selected=db.assessments.filter(a=>
    (!subject || sameKey(a.subject,subject)) &&
    (!className || sameKey(a.className,className))
  );
  const totals={};
  db.students.forEach(s=>{
    let earned=0,max=0;
    selected.forEach(a=>{earned+=Number(a.scores?.[s.id]||0);max+=Number(a.maxMark||0)});
    totals[s.id]={earned,max,ca40:max?Math.min(40,(earned/max)*40):0};
  });
  return {selected,totals};
}
function normalizeAssessmentQuestionSet(a){
  if(!a.questions || !a.questions.length) return;
  const exists=db.questionSets.some(q=>q.sourceAssessmentId===a.id);
  if(!exists){
    db.questionSets.push({
      id:'qs_'+a.id,
      sourceAssessmentId:a.id,
      source:'Assessment',
      date:a.date,
      subject:a.subject,
      className:a.className,
      questions:a.questions
    });
  }
}
function assessmentPage(){
 const list=db.assessments.map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.date)}</td><td>${esc(a.className)}</td><td>${esc(a.subject)}</td><td>${esc(a.assessmentName)}</td><td>/${a.maxMark}</td><td>${a.questions?.length||0}</td><td><div class="actions"><button class="secondary small" onclick="viewAssessment(${i})">View / Print</button><button class="primary small" onclick="editAssessment(${i})">Edit Scores</button><button class="delete-assessment small" onclick="deleteAssessment(${i})">Delete Assessment</button></div></td></tr>`).join('');
 return `<div class="card"><div class="section-title"><div style="display:flex;align-items:center;gap:10px"><button class="back-btn" onclick="showPage('dashboard')">← Return</button><h3>Continuous Assessment</h3></div><button class="primary" onclick="newAssessment()">+ New Assessment</button></div>
 <div class="notice">Every assessment you save is automatically included in the student's cumulative CA record. The system continuously converts the accumulated CA performance to a maximum of <b>40 marks</b>. When examination marks are entered, the final total and grade update automatically.</div>
 <div class="csv-panel"><h4>CSV Score Sheet for the Form Teacher</h4><p>Download a class-specific spreadsheet template for a teacher to fill, or export the completed subject CA /40 and examination /60 from the live result sheet. The exported CSV uses the columns <b>Student Name, Admission Number, CA, Exam</b> for the form teacher's report app.</p><div class="actions"><button class="secondary" onclick="openCsvTemplateModal()">Download Blank CSV Template</button><button class="secondary" onclick="openFinalResult()">Prepare Filled Scores & Export CSV</button></div></div>
 <div class="section-title"><h3>Saved Assessments</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>S/N</th><th>Date</th><th>Class</th><th>Subject</th><th>Assessment</th><th>Maximum</th><th>Questions</th><th>Source</th><th></th></tr></thead><tbody>${list||`<tr><td colspan="9" class="empty">No assessment saved yet.</td></tr>`}</tbody></table></div>
 <div class="section-title"><h3>Live Final Result</h3><button class="primary" onclick="openFinalResult()">Open CA /40 + Exam /60</button></div>
 </div>`;
}
function csvCell(value){const v=String(value??'');return '"'+v.replace(/"/g,'""')+'"'}
function downloadCsvFile(rows,filename){const csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function safeFilePart(value){return String(value||'').trim().replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'')||'Class'}
function openCsvTemplateModal(){
 const c=currentClass();if(!c)return toast('Create/select the class details first.');
 if(!classStudents().length)return toast('Add students to the selected class first.');
 openModal('Download Blank CSV Score Sheet',`<div class="notice">This creates a spreadsheet containing the registered students for <b>${esc(classLabel(c))}</b>. The teacher can open it in Excel or Google Sheets, fill the CA and Exam columns, save it as CSV, and send it to the form teacher.</div><div class="field"><label>Subject</label><input id="csvTemplateSubject" placeholder="e.g. Mathematics" autocomplete="off"></div><div class="field"><label>Term</label><input id="csvTemplateTerm" value="${esc(c.term||db.term||'')}" placeholder="e.g. First Term"></div><div class="field"><label>Session</label><input id="csvTemplateSession" value="${esc(c.session||db.session||'')}" placeholder="e.g. 2026/2027"></div><button class="primary" onclick="downloadBlankScoreTemplate()">Download CSV Template</button>`);
}
function downloadBlankScoreTemplate(){
 const c=currentClass();if(!c)return toast('Create/select the class details first.');
 const subject=document.getElementById('csvTemplateSubject')?.value.trim();const term=document.getElementById('csvTemplateTerm')?.value.trim()||c.term||db.term||'';const session=document.getElementById('csvTemplateSession')?.value.trim()||c.session||db.session||'';
 if(!subject)return toast('Enter the subject name first.');
 const students=classStudents().slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{sensitivity:'base'}));
 const rows=[['Student Name','Admission Number','CA','Exam'],...students.map(st=>[st.name,st.admission||'','',''])];
 const filename=`Dimah_Academy_${safeFilePart(classLabel(c))}_${safeFilePart(subject)}_${safeFilePart(term)}_${safeFilePart(session)}_Score_Template.csv`;
 downloadCsvFile(rows,filename);closeModal();toast('Blank CSV score sheet downloaded.');
}
function exportCompletedScoreCSV(){
 const ctx=window.activeResultContext;if(!ctx||!ctx.subject||!ctx.className)return toast('Open the live result sheet for a subject first.');
 const examInputs={};document.querySelectorAll('.exam-score').forEach(inp=>{examInputs[String(inp.dataset.student)]=inp.value.trim()});
 const allStudents=(ctx.students||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{sensitivity:'base'}));
 const rows=[['Student Name','Admission Number','CA','Exam']];
 allStudents.forEach(st=>{const ca=Number(ctx.caById?.[st.id]||0);const raw=examInputs[String(st.id)]??'';const exam=raw===''?'':Math.max(0,Math.min(60,Number(raw)||0));rows.push([st.name,st.admission||'',ca.toFixed(1),exam]);});

 const instructions=e.instructions?`<div class="exam-instructions"><span class="exam-label">INSTRUCTIONS:</span> ${esc(e.instructions)}</div>`:'';
 const dateDisplay=e.examDate?new Date(e.examDate+'T00:00:00').toLocaleDateString():e.date||'';
 document.getElementById('main').innerHTML=`<div class="card"><div class="exam-print-actions actions no-print"><button class="secondary" onclick="showPage('terminal')">← Return</button><button class="primary" onclick="window.print()">Print / Save PDF</button></div><div class="exam-paper"><div class="exam-paper-head"><div class="exam-paper-school">${esc(db.school)}</div><div class="exam-paper-title">${examTitle}</div></div><div class="exam-meta"><div class="exam-meta-row"><span><span class="exam-label">SUBJECT:</span> ${esc(e.subject||'')}</span><span><span class="exam-label">CLASS:</span> ${esc(e.className||'')}</span></div><div class="exam-meta-row"><span><span class="exam-label">DATE:</span> ${esc(dateDisplay)}</span><span><span class="exam-label">TIME:</span> ${esc(e.time||'')}</span></div></div>${instructions}${objectiveHtml}${essayHtml}</div></div>`;
}
function settingsPage(){
 const classRows=db.classes.map((c,i)=>`<tr><td>${i+1}</td><td><b>${esc(classLabel(c))}</b></td><td>${esc(c.session||'')}</td><td>${esc(c.term||'')}</td><td>${classStudents().length&&c.id===db.currentClassId?'Current':' '}</td></tr>`).join('');
 return `<div class="card" style="margin-bottom:15px"><div class="section-title"><h3 style="margin:0;color:var(--navy)">Class Profiles</h3><button class="primary" onclick="openClassModal()">+ Add Class</button></div><div class="notice">Create a separate class profile for every class you teach. Student names, assessments and results are kept separate by class.</div><div class="table-wrap"><table class="table"><thead><tr><th>S/N</th><th>Class</th><th>Session</th><th>Term</th><th>Status</th></tr></thead><tbody>${classRows||`<tr><td colspan="5" class="empty">No class profiles created yet.</td></tr>`}</tbody></table></div></div><div class="kpi-grid"><div class="card"><div style="margin-bottom:12px"><button class="back-btn" onclick="showPage('dashboard')">← Return</button></div><h3 style="margin-top:0;color:var(--navy)">School & Display</h3><div class="field"><label>School Name</label><input id="setSchool" value="${esc(db.school)}"></div><div class="field"><label>App Title</label><input id="setTitle" value="${esc(db.title)}"></div><div class="field"><label>Facilitator / Teacher</label><input id="setFac" value="${esc(db.facilitator)}"></div><div class="field"><label>Session</label><input id="setSession" value="${esc(db.session)}" placeholder="e.g. 2026/2027"></div><div class="field"><label>Term</label><input id="setTerm" value="${esc(db.term)}" placeholder="e.g. First Term"></div><button class="primary" onclick="saveSettings()">Save Display Settings</button></div>
 <div class="card"><h3 style="margin-top:0;color:var(--navy)">School Logo</h3><img src="${logoSrc()}" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:4px solid #edf2f6"><div class="field"><label>Upload logo</label><input id="logoFile" type="file" accept="image/*"></div><button class="secondary" onclick="saveLogo()">Save Logo</button><p class="small" style="color:var(--muted)">The logo is stored on this device for offline use.</p></div>
 <div class="card"><h3 style="margin-top:0;color:var(--navy)">Admin Security</h3><div class="field"><label>Username</label><input id="setUser" value="${esc(db.username)}"></div><div class="field"><label>New Password</label><input id="setPass" type="password" placeholder="Leave unchanged if blank"></div><button class="primary" onclick="saveSecurity()">Update Login</button><div class="notice" style="margin-top:12px">Default login for this first build: <b>admin</b> / <b>admin123</b>. Change it here.</div></div>
 <div class="card"><h3 style="margin-top:0;color:var(--navy)">Data Management</h3><button class="secondary" onclick="exportData()">Export Backup</button> <button class="secondary" onclick="document.getElementById('importFile').click()">Import Backup</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)"><button class="danger" onclick="resetData()">Reset All Local Data</button><p class="small" style="color:var(--muted);margin-top:12px">Keep backups because offline data is stored only on this device/browser.</p></div></div>`;
}
function saveSettings(){db.school=document.getElementById('setSchool').value.trim()||defaults.school;db.title=document.getElementById('setTitle').value.trim()||defaults.title;db.facilitator=document.getElementById('setFac').value.trim();db.session=document.getElementById('setSession').value.trim();db.term=document.getElementById('setTerm').value.trim();save();applySchoolTheme();document.getElementById('loginSchool').textContent=db.school;document.getElementById('sideSchool').textContent=db.school;document.getElementById('sideLogo').src=logoSrc();document.getElementById('loginLogo').src=logoSrc();toast('Display settings saved.');render()}
function saveLogo(){const f=document.getElementById('logoFile').files[0];if(!f)return toast('Choose a logo first.');const r=new FileReader();r.onload=()=>{db.logo=r.result;save();applySchoolTheme();document.getElementById('loginLogo').src=logoSrc();document.getElementById('sideLogo').src=logoSrc();toast('Logo saved offline. School colours updated from the logo.');render()};r.readAsDataURL(f)}
function saveSecurity(){const u=document.getElementById('setUser').value.trim(),p=document.getElementById('setPass').value;if(!u)return toast('Username cannot be empty.');if(p&&p.length<4)return toast('Password must be at least 4 characters.');if(!p&&u===db.username)return toast('No login change was made.');db.username=u;if(p)db.password=p;const auth={username:db.username,password:db.password};localStorage.setItem(KEY+'_auth',JSON.stringify(auth));localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('setPass').value='';document.getElementById('username').value=db.username;document.getElementById('password').value='';toast('Login details saved. Logout and sign in with the new credentials.')}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CA_Record_Backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported.')}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);db={...defaults,...x};save();location.reload()}catch(err){toast('Invalid backup file.')}};r.readAsText(f)}
function resetData(){if(confirm('This will delete all students, assessments, questions and settings stored on this device. Continue?')){localStorage.removeItem(KEY);localStorage.removeItem(KEY+'_logged');localStorage.removeItem(KEY+'_auth');location.reload()}}
function printStudents(){sortStudents();document.getElementById('main').innerHTML=`<div class="card"><div class="print-head" style="display:block"><div class="school-print">${esc(db.school)}</div><div class="title-print">Student Register</div></div><div class="actions no-print" style="margin-bottom:15px"><button class="secondary" onclick="showPage('students')">Back</button><button class="primary" onclick="window.print()">Print / Save PDF</button></div><table class="table"><thead><tr><th>S/N</th><th>Student Name</th><th>Gender</th><th>Admission No.</th></tr></thead><tbody>${db.students.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${esc(s.gender||'')}</td><td>${esc(s.admission||'')}</td></tr>`).join('')}</tbody></table></div>`}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=30').catch(()=>{}));}
init();
</script>
</body>
</html>
